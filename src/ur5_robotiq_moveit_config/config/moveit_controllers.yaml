# Controllers of ur5_robotiq_bringup/config/ur5_robotiq_controllers.yaml, used through
# moveit_simple_controller_manager
controller_list:
  - name: pos_joint_traj_controller
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
  - name: gripper_controller
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    # A grasp that stalls on an object ends as ABORTED (stalled) in the Noetic GripperActionController; count it
    # as success.
    allow_failure: true
    joints:
      - finger_joint
