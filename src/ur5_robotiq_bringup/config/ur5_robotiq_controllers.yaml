# Arm: the position-interface controllers of ur_gazebo/config/ur5_controllers.yaml. The effort-interface ones are not
# used: the gripper's mimic joints are set kinematically every step, which an effort-controlled wrist does not withstand.
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: &loop_hz 125

pos_joint_traj_controller:
  type: position_controllers/JointTrajectoryController
  joints: &robot_joints
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  constraints:
    goal_time: 0.6
    stopped_velocity_tolerance: 0.05
    shoulder_pan_joint: {trajectory: 0.1, goal: 0.1}
    shoulder_lift_joint: {trajectory: 0.1, goal: 0.1}
    elbow_joint: {trajectory: 0.1, goal: 0.1}
    wrist_1_joint: {trajectory: 0.1, goal: 0.1}
    wrist_2_joint: {trajectory: 0.1, goal: 0.1}
    wrist_3_joint: {trajectory: 0.1, goal: 0.1}
  stop_trajectory_duration: 0.5
  state_publish_rate: *loop_hz
  action_monitor_rate: 10

joint_group_pos_controller:
  type: position_controllers/JointGroupPositionController
  joints: *robot_joints

# Robotiq 2F-85: one commanded joint, the others follow it (mimic plugin, see ur5_robotiq_description).
# control_msgs/GripperCommand on /gripper_controller/gripper_cmd, 0.0 open ... 0.8 closed.
gripper_controller:
  type: position_controllers/GripperActionController
  joint: finger_joint
  goal_tolerance: 0.01
  stall_velocity_threshold: 0.01
  stall_timeout: 0.5
  action_monitor_rate: 20
